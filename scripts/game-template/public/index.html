<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root { --bg: #0d0f1c; --text: #f1f2f8; --muted: #a6acc8; --accent: #f3d36b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px; text-align: center;
    }
    h1 { font-size: clamp(36px, 8vw, 64px); margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>__TITLE__</h1>
    <p>Coming soon to Cheetah Moon Games.</p>
    <p id="player" aria-live="polite"></p>
    <a href="https://cheetahmoongames.com/">More games</a>
  </main>
  <script>
    // Every game shares one sign-in, at cheetahmoongames.com.
    fetch('/api/me').then((r) => r.json()).then((me) => {
      const el = document.getElementById('player');
      if (me.signedIn) {
        el.textContent = 'Signed in as ' + me.name;
      } else {
        const a = document.createElement('a');
        a.href = me.loginUrl;
        a.textContent = 'Sign in';
        el.append(a, ' to play.');
      }
    }).catch(() => {});
  </script>
</body>
</html>
