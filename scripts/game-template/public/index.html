<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>__TITLE__</title>
  <meta name="description" content="__TITLE__ on Cheetah Moon Games.">
  <!-- Icons and installing: see "Icons and installing" in ADDING_A_GAME.md. -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0f1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="__TITLE__">
  <style>
    :root { --bg: #0d0f1c; --text: #f1f2f8; --muted: #a6acc8; --accent: #f3d36b; --line: #2c3354; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Every game: a way back to the others, and who's signed in. */
    .bar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line); font-size: 15px;
    }
    .bar .home { color: var(--muted); text-decoration: none; }
    .bar .home:hover { color: var(--text); }
    .bar .account { color: var(--muted); text-align: right; }
    .bar .account strong { color: var(--text); }

    main { flex: 1; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
    h1 { font-size: clamp(36px, 8vw, 64px); margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }

    /* Buy me a coffee: the same badge on every game (see ADDING_A_GAME.md). */
    .bmc {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: #ffdd00; color: #0d0c22;
      font: 600 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-decoration: none; white-space: nowrap;
    }
    .bmc:hover { background: #ffe74d; }
    .bmc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .bmc svg { width: 18px; height: 18px; flex: none; }
    .foot { display: flex; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <header class="bar">
    <a class="home" href="https://cheetahmoongames.com/" aria-label="More games from Cheetah Moon Games">&larr; Cheetah Moon Games</a>
    <span class="account" id="account" aria-live="polite"></span>
  </header>
  <main>
    <div>
      <h1>__TITLE__</h1>
      <p>Coming soon to Cheetah Moon Games.</p>
    </div>
  </main>
  <footer class="foot">
    <a class="bmc" href="https://buymeacoffee.com/mrkyle7" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 7h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V7Zm13 1.5h1a3 3 0 0 1 0 6h-1.3c.2-.5.3-1 .3-1.5h1a1.5 1.5 0 0 0 0-3h-1V8.5ZM3 19.5h15V21H3v-1.5Z"/></svg>
      Buy me a coffee
    </a>
  </footer>
  <script>
    // Every game shares one sign-in, at cheetahmoongames.com. Its page also
    // creates accounts and resets forgotten passwords.
    fetch('/api/me').then((r) => r.json()).then((me) => {
      const el = document.getElementById('account');
      if (me.signedIn) {
        const name = document.createElement('strong');
        name.textContent = me.name;
        el.append('Signed in as ', name);
      } else {
        const a = document.createElement('a');
        a.href = me.loginUrl;
        a.textContent = 'Sign in';
        el.append(a);
      }
    }).catch(() => {});

    // Lets players install the game on their phone or desktop.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
