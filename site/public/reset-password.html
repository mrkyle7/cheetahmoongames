<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Choose a new password · Cheetah Moon Games</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        main {
            max-width: 440px;
            margin: 0 auto;
            padding: 48px 16px 40px;
        }

        .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 700; }
        .brand .moon { width: 36px; height: 36px; }
        .brand:focus-visible { outline: 3px solid var(--moon); outline-offset: 4px; border-radius: 4px; }

        .panel {
            margin-top: 28px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 26px 24px 24px;
        }

        h1 { margin: 0; font-size: 28px; line-height: 1.15; }
        .sub { margin: 6px 0 22px; color: var(--muted); }
        .sub strong { color: var(--text); font-weight: 600; }

        form { display: grid; gap: 16px; }
        label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
        .hint { font-weight: 400; color: var(--muted); font-size: 13px; }

        input {
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 11px 12px;
            width: 100%;
        }
        input:focus { outline: 3px solid var(--moon); outline-offset: 1px; border-color: transparent; }
        input[aria-invalid="true"] { border-color: var(--danger); }

        .password { position: relative; }
        .password input { padding-right: 64px; }
        .reveal {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            font: inherit; font-size: 13px; font-weight: 600;
            color: var(--muted); background: none; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 4px;
        }
        .reveal:hover { color: var(--text); }
        .reveal:focus-visible { outline: 2px solid var(--moon); }

        .primary {
            font: inherit; font-weight: 700;
            color: #1a1405;
            background: var(--moon);
            border: 0; border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
        }
        .primary:hover { background: #f7df8d; }
        .primary:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
        .primary[disabled] { opacity: 0.6; cursor: progress; }

        .error {
            margin: 0;
            padding: 10px 12px;
            border-left: 4px solid var(--danger);
            background: rgba(255, 107, 107, 0.1);
            border-radius: 4px;
        }
        .error:empty { display: none; }

        .switch { margin: 20px 0 0; color: var(--muted); text-align: center; }
        .link {
            font: inherit; color: var(--moon); background: none; border: 0; padding: 0;
            text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
        }
        .link:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }

        .forgot { margin: -4px 0 0; text-align: center; font-size: 15px; }
        .sent p { margin: 0 0 14px; }
        .sent .hint { color: var(--muted); font-size: 15px; }

        .signed-in p { margin: 0 0 18px; }
        .signed-in .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .signed-in .primary { text-decoration: none; display: inline-block; }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/" aria-label="Cheetah Moon Games home">
            <span class="moon" aria-hidden="true"><span></span><span></span><span></span></span>
            Cheetah Moon Games
        </a>

        <section class="panel" aria-labelledby="title">
            <h1 id="title">Choose a new password</h1>
            <p class="sub" id="sub">You'll be signed in straight after, and signed out everywhere else.</p>

            <p class="error" id="error" role="alert"></p>

            <form id="resetForm" novalidate>
                <label>New password
                    <span class="hint" id="passwordHint">At least 8 characters, with a letter and a number.</span>
                    <span class="password">
                        <input id="newPassword" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="passwordHint">
                        <button class="reveal" type="button" aria-controls="newPassword" aria-label="Show password">Show</button>
                    </span>
                </label>
                <button class="primary" type="submit">Save password and sign in</button>
            </form>

            <div id="expired" hidden>
                <p class="sub">Links work once, for an hour after they're sent.</p>
                <a class="primary" id="newLink" href="/login?mode=forgot" style="display:inline-block;text-decoration:none">Send me a new link</a>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const token = params.get('token') || '';
            const next = params.get('next') || '/';
            const $ = (id) => document.getElementById(id);
            const error = $('error');

            $('newLink').href = '/login?mode=forgot&next=' + encodeURIComponent(next);

            function expired(message) {
                $('title').textContent = 'This link has expired';
                error.textContent = message || '';
                $('resetForm').hidden = true;
                $('sub').hidden = true;
                $('expired').hidden = false;
                $('newLink').focus();
            }

            if (!token) return expired('This page needs the link from your email. Ask for a new one if you need it.');

            document.querySelector('.reveal').addEventListener('click', (e) => {
                const b = e.currentTarget;
                const input = $('newPassword');
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                b.textContent = show ? 'Hide' : 'Show';
                b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });

            function fail(message) {
                error.textContent = message;
                $('newPassword').setAttribute('aria-invalid', 'true');
                $('newPassword').focus();
            }

            $('resetForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const pw = $('newPassword').value;
                if (pw.length < 8) return fail('Your password needs at least 8 characters.');
                if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return fail('Your password needs at least one letter and one number.');
                const button = e.target.querySelector('.primary');
                button.disabled = true;
                error.textContent = '';
                try {
                    const r = await fetch('/api/account/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password: pw, next }),
                    });
                    const data = await r.json().catch(() => ({}));
                    if (r.ok) {
                        location.assign(data.next || '/');
                        return;
                    }
                    if (data.expired) return expired(data.error);
                    fail(data.error || 'Something went wrong. Please try again.');
                } catch (err) {
                    fail("We couldn't reach the server. Check your connection and try again.");
                }
                button.disabled = false;
            });

            $('newPassword').focus();
        })();
    </script>
</body>
</html>
