<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Verify your email · Cheetah Moon Games</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        main {
            max-width: 440px;
            margin: 0 auto;
            padding: 48px 16px 40px;
        }

        .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 700; }
        .brand .moon { width: 36px; height: 36px; }
        .brand:focus-visible { outline: 3px solid var(--moon); outline-offset: 4px; border-radius: 4px; }

        .panel {
            margin-top: 28px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 26px 24px 24px;
        }

        h1 { margin: 0; font-size: 28px; line-height: 1.15; }
        .sub { margin: 6px 0 22px; color: var(--muted); }
        .sub strong { color: var(--text); font-weight: 600; }

        form { display: grid; gap: 16px; }

        .primary {
            font: inherit; font-weight: 700;
            color: #1a1405;
            background: var(--moon);
            border: 0; border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
        }
        .primary:hover { background: #f7df8d; }
        .primary:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
        .primary[disabled] { opacity: 0.6; cursor: progress; }

        .error {
            margin: 0;
            padding: 10px 12px;
            border-left: 4px solid var(--danger);
            background: rgba(255, 107, 107, 0.1);
            border-radius: 4px;
        }
        .error:empty { display: none; }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/" aria-label="Cheetah Moon Games home">
            <span class="moon" aria-hidden="true"><span></span><span></span><span></span></span>
            Cheetah Moon Games
        </a>

        <section class="panel" aria-labelledby="title">
            <h1 id="title">Verify your email</h1>
            <p class="sub" id="sub">One click and you're in. You'll be signed in straight after.</p>

            <p class="error" id="error" role="alert"></p>

            <form id="verifyForm" novalidate>
                <button class="primary" type="submit">Verify my email and sign in</button>
            </form>

            <div id="expired" hidden>
                <p class="sub">Links work once, for 24 hours after they're sent. Sign in with your name and password and we'll email you a new one.</p>
                <a class="primary" id="signIn" href="/login" style="display:inline-block;text-decoration:none">Sign in</a>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const token = params.get('token') || '';
            const next = params.get('next') || '/';
            const $ = (id) => document.getElementById(id);
            const error = $('error');

            $('signIn').href = '/login?next=' + encodeURIComponent(next);

            function expired(message) {
                $('title').textContent = "This link doesn't work any more";
                error.textContent = message || '';
                $('verifyForm').hidden = true;
                $('sub').hidden = true;
                $('expired').hidden = false;
                $('signIn').focus();
            }

            if (!token) return expired('This page needs the link from your email.');

            // Verified with a click rather than on load, so email scanners
            // that open links don't use it up.
            $('verifyForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const button = e.target.querySelector('.primary');
                button.disabled = true;
                error.textContent = '';
                try {
                    const r = await fetch('/api/account/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, next }),
                    });
                    const data = await r.json().catch(() => ({}));
                    if (r.ok) {
                        location.assign(data.next || '/');
                        return;
                    }
                    if (data.expired) return expired(data.error);
                    error.textContent = data.error || 'Something went wrong. Please try again.';
                } catch (err) {
                    error.textContent = "We couldn't reach the server. Check your connection and try again.";
                }
                button.disabled = false;
            });

            document.querySelector('#verifyForm .primary').focus();
        })();
    </script>
</body>
</html>
